<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} — AMARTIE</title>
    <style>
        :root{--bg:#04060b;--surface:#0f1319;--ink:#f0f2f5;--dim:#8b949e;--line:rgba(255,255,255,.06);--gold:#ffd166;--cyan:#58a6ff;--green:#3fb950;--red:#f85149}
        *{box-sizing:border-box;margin:0;padding:0}
        body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.6;padding:40px 20px;max-width:900px;margin:0 auto}
        h1{color:var(--gold);font-size:32px;margin-bottom:10px}
        h2{color:var(--cyan);font-size:24px;margin-top:30px;margin-bottom:15px}
        h3{color:var(--gold);font-size:18px;margin-top:20px}
        h4{color:var(--gold);font-size:16px;margin-top:15px}
        p{margin-bottom:15px}
        a{color:var(--cyan);text-decoration:none}
        a:hover{text-decoration:underline}
        hr{border:none;border-top:1px solid var(--line);margin:30px 0}
        code{background:var(--surface);padding:2px 6px;border-radius:3px;font-size:14px}
        pre{background:var(--surface);padding:15px;overflow-x:auto;border-radius:4px;margin:15px 0}
        pre code{background:none;padding:0}
        ul{margin-left:20px;margin-bottom:15px}
        ol{margin-left:20px;margin-bottom:15px}
        li{margin-bottom:8px}
        table{width:100%;border-collapse:collapse;margin:20px 0}
        th,td{padding:10px;border:1px solid var(--line);text-align:left}
        th{background:var(--surface);color:var(--gold)}
        strong{color:var(--ink)}
        em{color:var(--dim)}
        .nav{background:var(--surface);padding:15px 20px;border-radius:8px;margin-bottom:30px;display:flex;gap:20px;align-items:center}
        .nav .brand{color:var(--gold);font-weight:bold;font-size:18px;margin-right:auto}
        .nav a{color:var(--cyan);text-decoration:none;font-size:14px;text-transform:uppercase;letter-spacing:1px}
        .nav a:hover{text-decoration:underline}
        .date{color:var(--dim);font-size:14px;margin-bottom:20px}
        .footer{text-align:center;margin-top:40px;color:var(--dim);font-size:12px}
    </style>
</head>
<body>

<div class="nav">
    <span class="brand">AMARTIE</span>
    <a href="/">HOME</a>
    <a href="/blog/">BLOG</a>
    <a href="https://github.com/amartieai/amartie">GITHUB</a>
    <a href="https://github.com/amartieai/amartie/issues">ISSUES</a>
</div>

<article>
    <h1>{{ page.title }}</h1>
    <p class="date">{{ page.date | date: "%B %d, %Y" }}</p>
    {{ content }}
</article>

<div class="footer">
    <p>AMARTIE — Receipts, not promises.</p>
</div>

</body>
</html>
