[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amartie"
version = "0.1.0"
description = "Forensic engine that detects silent AI model swaps in session logs."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Anonymous" }]
requires-python = ">=3.9"

[project.scripts]
amartie = "amartie.cli:main"

[tool.setuptools.packages.find]
include = ["amartie*"]
exclude = ["fixtures*", "tests*", "martie*", "receipts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
