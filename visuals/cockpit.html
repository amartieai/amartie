<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMARTIE Cockpit</title>
<style>
:root{
  --bg:#03060c;
  --surface:rgba(10,14,24,.72);
  --ink:#e8ecf4;
  --dim:#6b7689;
  --gold:#ffd166;
  --cyan:#4cc9ff;
  --purple:#a78bfa;
  --green:#4ade80;
  --red:#f87171;
  --pink:#f472b6;
  --line:rgba(255,255,255,.06);
  --glass:rgba(255,255,255,.03);
  --radius:12px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;
  position:relative;
}

/* Animated Background */
.bg-anim{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 50% at 20% 40%,rgba(255,209,102,.06) 0%,transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 60%,rgba(76,201,255,.05) 0%,transparent 60%),
    radial-gradient(ellipse 50% 30% at 50% 100%,rgba(167,139,250,.04) 0%,transparent 60%);
  animation:bgDrift 18s var(--ease) infinite alternate;
}
@keyframes bgDrift{
  0%{transform:translate(0,0) scale(1)}
  100%{transform:translate(20px,-10px) scale(1.02)}
}
.bg-grid{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000 30%,transparent 80%);
  opacity:.4;
}

/* Layout */
.app{display:flex;flex-direction:column;height:100vh;position:relative;z-index:1}
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;
  border-bottom:1px solid var(--line);
  background:rgba(3,6,15,.6);
  backdrop-filter:blur(20px);
  z-index:10;
}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px;letter-spacing:.04em}
.logo-icon{
  width:28px;height:28px;border-radius:8px;
  background:linear-gradient(135deg,var(--gold),#e6a800);
  display:flex;align-items:center;justify-content:center;
  font-weight:900;color:var(--bg);font-size:13px;
  box-shadow:0 0 20px rgba(255,209,102,.3);
}
.header-right{display:flex;gap:8px;align-items:center}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.voice-toggle{
  display:flex;align-items:center;gap:6px;
  background:var(--surface);border:1px solid var(--line);
  padding:6px 12px;border-radius:20px;
  font-size:11px;letter-spacing:.04em;color:var(--dim);
  cursor:pointer;transition:all .2s var(--ease);
}
.voice-toggle:hover{border-color:var(--gold);color:var(--ink)}
.voice-toggle.active{background:var(--gold);color:var(--bg);border-color:var(--gold)}

/* Main */
main{display:flex;flex:1;overflow:hidden}
.sidebar{
  width:240px;border-right:1px solid var(--line);
  background:rgba(3,6,15,.4);backdrop-filter:blur(12px);
  padding:16px;display:flex;flex-direction:column;gap:4px;
  overflow-y:auto;
}
.section-label{
  font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);padding:8px 12px 4px;font-weight:600;
}
.plugin-btn{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;border-radius:var(--radius);
  background:transparent;border:1px solid transparent;
  color:var(--dim);font-size:13px;font-weight:500;
  cursor:pointer;transition:all .2s var(--ease);
  position:relative;overflow:hidden;
}
.plugin-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,209,102,.08),transparent 60%);
  opacity:0;transition:opacity .2s var(--ease);
}
.plugin-btn:hover{color:var(--ink);background:var(--glass);border-color:var(--line)}
.plugin-btn:hover::before{opacity:1}
.plugin-btn.active{
  background:linear-gradient(135deg,rgba(255,209,102,.12),rgba(255,209,102,.04));
  border-color:rgba(255,209,102,.25);
  color:var(--gold);
}
.plugin-btn.active .plugin-icon{filter:grayscale(0);opacity:1}
.plugin-icon{
  width:32px;height:32px;border-radius:8px;
  background:var(--glass);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
  filter:grayscale(.5);opacity:.7;
  transition:all .2s var(--ease);
}
.plugin-info{display:flex;flex-direction:column;gap:2px}
.plugin-name{font-size:13px;font-weight:600}
.plugin-desc{font-size:10px;color:var(--dim);font-weight:400}

/* Content */
.content{flex:1;padding:32px;overflow-y:auto;position:relative}
.studio{display:none;animation:fadeUp .4s var(--ease)}
.studio.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.hero{
  text-align:center;padding:60px 20px 40px;
  max-width:600px;margin:0 auto;
}
.hero h1{font-family:Georgia,serif;font-size:44px;font-weight:400;line-height:1.1;margin-bottom:14px;letter-spacing:-.02em}
.hero h1 .accent{background:linear-gradient(135deg,var(--gold),#ff8c00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--dim);font-size:15px;line-height:1.7;margin-bottom:28px}
.quick-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.quick-btn{
  display:flex;align-items:center;gap:8px;
  padding:12px 20px;border-radius:var(--radius);
  background:var(--surface);border:1px solid var(--line);
  color:var(--ink);font-size:13px;font-weight:500;
  cursor:pointer;transition:all .2s var(--ease);
}
.quick-btn:hover{border-color:var(--gold);transform:translateY(-2px)}
.quick-btn .qicon{font-size:18px}

/* Studio Header */
.studio-header{margin-bottom:32px}
.studio-header h2{font-family:Georgia,serif;font-size:32px;font-weight:400;margin-bottom:4px;display:flex;align-items:center;gap:12px}
.studio-header .desc{color:var(--dim);font-size:14px}

/* Genre Grid */
.genre-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:24px}
.genre-btn{
  padding:14px 8px;border-radius:var(--radius);
  background:var(--surface);border:1px solid var(--line);
  text-align:center;cursor:pointer;transition:all .2s var(--ease);
  color:var(--dim);font-size:11px;font-weight:500;
}
.genre-btn:hover{border-color:var(--gold);color:var(--ink);transform:translateY(-2px)}
.genre-btn.active{background:linear-gradient(135deg,var(--gold),#e6a800);color:var(--bg);border-color:var(--gold);font-weight:700}
.genre-btn .icon{display:block;font-size:22px;margin-bottom:6px}

/* Controls */
.controls{display:grid;gap:16px;max-width:700px}
.control label{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:6px;font-weight:600}
.control input,.control textarea,.control select{
  width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:12px 14px;color:var(--ink);
  font-family:inherit;font-size:14px;transition:border-color .2s var(--ease);
}
.control textarea{min-height:80px;resize:vertical}
.control input:focus,.control textarea:focus,.control select:focus{outline:none;border-color:var(--gold)}

/* Buttons */
.btn-row{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.btn{
  padding:12px 24px;border-radius:var(--radius);
  font-weight:600;font-size:13px;letter-spacing:.04em;
  cursor:pointer;transition:all .2s var(--ease);
  display:flex;align-items:center;gap:8px;
}
.btn-primary{
  background:linear-gradient(135deg,var(--gold),#e6a800);
  color:var(--bg);border:none;
  box-shadow:0 4px 16px rgba(255,209,102,.25);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,209,102,.35)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn-secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn-secondary:hover{border-color:var(--gold)}

/* Status */
.status{margin-top:16px;font-size:13px;color:var(--dim);min-height:24px}
.result{margin-top:24px;display:flex;flex-wrap:wrap;gap:16px}
.result img,.result video{max-width:350px;border-radius:var(--radius);border:1px solid var(--line)}

/* Waveform Visualizer */
.waveform{
  height:60px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);display:flex;align-items:center;justify-content:center;
  gap:3px;padding:0 20px;margin-bottom:24px;overflow:hidden;
}
.wave-bar{width:3px;background:var(--gold);border-radius:2px;animation:wave 1.2s ease-in-out infinite alternate}
.wave-bar:nth-child(2){animation-delay:.1s}
.wave-bar:nth-child(3){animation-delay:.2s}
.wave-bar:nth-child(4){animation-delay:.3s}
.wave-bar:nth-child(5){animation-delay:.4s}
.wave-bar:nth-child(6){animation-delay:.5s}
.wave-bar:nth-child(7){animation-delay:.6s}
.wave-bar:nth-child(8){animation-delay:.7s}
.wave-bar:nth-child(9){animation-delay:.8s}
.wave-bar:nth-child(10){animation-delay:.9s}
.wave-bar:nth-child(11){animation-delay:1.0s}
.wave-bar:nth-child(12){animation-delay:1.1s}
@keyframes wave{0%{height:8px}100%{height:32px}}

/* Voice Bubble */
.voice-bubble{
  background:var(--surface);border:1px solid rgba(255,209,102,.2);
  border-left:3px solid var(--gold);
  border-radius:0 var(--radius) var(--radius) var(--radius);
  padding:16px 20px;margin:20px 0;
  font-size:14px;color:var(--ink);max-width:560px;
  line-height:1.6;
}

@media(max-width:800px){
  .sidebar{display:none}
  .hero h1{font-size:32px}
  .genre-grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div class="bg-anim"></div>
<div class="bg-grid"></div>
<div class="app">
  <header>
    <div class="logo">
      <div class="logo-icon">A</div>
      <span>AMARTIE</span>
    </div>
    <div class="header-right">
      <div class="status-dot"></div>
      <button class="voice-toggle" id="voiceBtn" onclick="toggleVoice()">Voice</button>
    </div>
  </header>
  <main>
    <aside class="sidebar">
      <div class="section-label">Studios</div>
      <div id="sidebar"></div>
    </aside>
    <section class="content" id="content">
      <div class="hero">
        <h1>Your AI, <span class="accent">Verified.</span></h1>
        <p>The open-source framework that proves your AI wasn't swapped. Nine independent judges. Hash-chained receipts.</p>
        <div class="quick-actions">
          <button class="quick-btn" onclick="Cockpit.load('suno-studio')"><span class="qicon">🎵</span>Music</button>
          <button class="quick-btn" onclick="Cockpit.load('luma-studio')"><span class="qicon">🎬</span>Video</button>
          <button class="quick-btn" onclick="Cockpit.load('leonardo-studio')"><span class="qicon">🎨</span>Image</button>
          <button class="quick-btn" onclick="Cockpit.load('elevenlabs-studio')"><span class="qicon">🗣️</span>Voice</button>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
const Cockpit = {
  voiceEnabled: false,
  synth: window.speechSynthesis,
  selectedGenre: null,
  
  plugins: {
    'suno-studio': {
      name: 'Suno Studio', icon: '🎵', desc: 'Music generation',
      render: () => this.renderMusic()
    },
    'luma-studio': {
      name: 'Luma Studio', icon: '🎬', desc: 'Video generation',
      render: () => this.renderStudio('Luma Dream Machine', 'video')
    },
    'leonardo-studio': {
      name: 'Leonardo Studio', icon: '🎨', desc: 'Image generation',
      render: () => this.renderStudio('Leonardo.Ai', 'image')
    },
    'runway-studio': {
      name: 'Runway Studio', icon: '🎥', desc: 'Video synthesis',
      render: () => this.renderStudio('RunwayML', 'video')
    },
    'elevenlabs-studio': {
      name: 'ElevenLabs Studio', icon: '🗣️', desc: 'Voice synthesis',
      render: () => this.renderVoice()
    }
  },
  
  init() {
    const sb = document.getElementById('sidebar');
    sb.innerHTML = '';
    Object.entries(this.plugins).forEach(([id, p]) => {
      const btn = document.createElement('button');
      btn.className = 'plugin-btn';
      btn.innerHTML = `<div class="plugin-icon">${p.icon}</div><div class="plugin-info"><div class="plugin-name">${p.name}</div><div class="plugin-desc">${p.desc}</div></div>`;
      btn.onclick = () => this.load(id);
      sb.appendChild(btn);
    });
  },
  
  load(id) {
    const p = this.plugins[id];
    if (!p) return;
    document.querySelectorAll('.plugin-btn').forEach(b => b.classList.toggle('active', b.querySelector('.plugin-name').textContent === p.name));
    document.getElementById('content').innerHTML = `<div class="studio active">${p.render()}</div>`;
    if (this.voiceEnabled) setTimeout(() => this.speak(`Welcome to ${p.name}. What would you like to create?`), 400);
  },
  
  renderMusic() {
    const genres = [
      {id:'country',n:'Country',i:'🤠'},
      {id:'blues',n:'Blues',i:'🎸'},
      {id:'jazz',n:'Jazz',i:'🎷'},
      {id:'reggae',n:'Reggae',i:'🌴'},
      {id:'electronic',n:'Electronic',i:'🎛️'},
      {id:'classical',n:'Classical',i:'🎻'},
      {id:'rock',n:'Rock',i:'🤘'},
      {id:'hiphop',n:'Hip-Hop',i:'🎤'},
      {id:'ambient',n:'Ambient',i:'🌊'},
      {id:'soul',n:'Soul',i:'💋'},
      {id:'metal',n:'Metal',i:'⚡'},
      {id:'folk',n:'Folk',i:'🪕'},
      {id:'disco',n:'Disco',i:'🪩'},
      {id:'bach_meets_blues',n:'Bach+Blues',i:'🎹'},
      {id:'beethoven_meets_reggae',n:'Beethoven+Reggae',i:'🏛️'},
      {id:'texas_holdem_rock',n:'Texas Hold\'em',i:'🤠'},
      {id:'cyberpunk_jazz',n:'Cyberpunk Jazz',i:'🌃'}
    ];
    return `
      <div class="studio-header"><h2><span style="font-size:32px">🎵</span> Suno Studio</h2><p class="desc">AI music generation — vocals, instrumentals, full songs</p></div>
      <div class="voice-bubble">👋 Hey! What do you want to create today? Pick a genre below, or tell me something crazy like "reggae with Mozart and bluegrass."</div>
      <div class="waveform"><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div></div>
      <div class="genre-grid">${genres.map(g => `<button class="genre-btn" onclick="Cockpit.selectGenre('${g.id}',this)"><span class="icon">${g.i}</span>${g.n}</button>`).join('')}</div>
      <div class="controls">
        <div class="control"><label>What's it about?</label><input type="text" id="music-theme" placeholder="e.g. driving home for Christmas, a rainy city night..."></div>
        <div class="control"><label>Mood</label><select id="music-mood"><option>heartfelt</option><option>upbeat</option><option>melancholic</option><option>nostalgic</option><option>euphoric</option><option>dark</option><option>smooth</option></select></div>
        <div class="control"><label>Details</label><textarea id="music-details" rows="2" placeholder="Instruments, tempo, era, vibe..."></textarea></div>
      </div>
      <div class="btn-row"><button class="btn btn-primary" onclick="cockpitGenerate()">Generate Song</button><button class="btn btn-secondary" onclick="cockpitLyrics()">Just Lyrics</button></div>
      <div class="status" id="music-status"></div>
      <div class="result" id="music-result"></div>
    `;
  },
  
  selectGenre(id, btn) {
    document.querySelectorAll('.genre-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    this.selectedGenre = id;
  },
  
  renderStudio(name, type) {
    return `
      <div class="studio-header"><h2><span style="font-size:32px">${type === 'video' ? '🎬' : '🎨'}</span> ${name}</h2><p class="desc">AI ${type} generation</p></div>
      <div class="voice-bubble">🎬 Ready to create a ${type}. What's the vision?</div>
      <div class="controls">
        <div class="control"><label>Prompt</label><textarea id="gen-prompt" rows="4" placeholder="Describe what you want to create..."></textarea></div>
        <div class="control"><label>Model</label><select id="gen-model"><option>ray-3</option><option>ray-2</option><option>gen4.5</option></select></div>
      </div>
      <div class="btn-row"><button class="btn btn-primary" onclick="cockpitGenerate()">Generate</button></div>
      <div class="status" id="gen-status"></div>
      <div class="result" id="gen-result"></div>
    `;
  },
  
  renderVoice() {
    return `
      <div class="studio-header"><h2><span style="font-size:32px">🗣️</span> ElevenLabs Studio</h2><p class="desc">Text-to-speech and voice synthesis</p></div>
      <div class="voice-bubble">🗣️ Ready to speak. Type something below and I'll say it out loud.</div>
      <div class="controls">
        <div class="control"><label>Text</label><textarea id="voice-text" rows="4" placeholder="Type anything and hear it spoken..."></textarea></div>
        <div class="control"><label>Voice</label><select id="voice-id"><option value="onwK4e9ZLuTAKqWW03F9">Daniel</option><option value="AZnzlk1XvdvUeBnXmlld">Domi</option><option value="EXAVITQu4vr4xnSDxMaL">Bella</option><option value="ErXwobaYiN019PkySvjV">Adam</option></select></div>
      </div>
      <div class="btn-row"><button class="btn btn-primary" onclick="cockpitSpeak()">Speak</button></div>
      <div class="status" id="voice-status"></div>
    `;
  },
  
  speak(text) {
    if (!this.voiceEnabled || !this.synth) return;
    this.synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.92; u.pitch = 1.0; u.volume = 0.85;
    this.synth.speak(u);
  }
};

function toggleVoice() {
  Cockpit.voiceEnabled = !Cockpit.voiceEnabled;
  const btn = document.getElementById('voiceBtn');
  if (Cockpit.voiceEnabled) { btn.classList.add('active'); btn.textContent = '🔊 Voice On'; Cockpit.speak('Voice enabled. What would you like to create?'); }
  else { btn.classList.remove('active'); btn.textContent = 'Voice'; Cockpit.synth.cancel(); }
}

function cockpitGenerate() {
  const status = document.getElementById('music-status') || document.getElementById('gen-status');
  const result = document.getElementById('music-result') || document.getElementById('gen-result');
  status.textContent = '⏳ Generating... (demo — add API key for real generation)';
  setTimeout(() => {
    status.textContent = '✅ Demo output:';
    result.innerHTML = `<div style="padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:12px;width:100%"><p style="font-weight:600;margin-bottom:8px">Demo Mode</p><p style="font-size:13px;color:var(--dim);line-height:1.7">This is a working prototype. For real generation:</p><ol style="font-size:13px;color:var(--dim);margin-top:8px;padding-left:20px;line-height:1.8"><li>Get a free API key (Suno, Luma, etc.)</li><li>Set environment variable</li><li>Restart — real generation activates</li></ol></div>`;
    if (Cockpit.voiceEnabled) Cockpit.speak('This is a demo. Add your API key for real generation.');
  }, 1500);
}

function cockpitLyrics() {
  document.getElementById('music-status').textContent = '📝 Generating...';
  setTimeout(() => {
    document.getElementById('music-status').textContent = 'Demo lyrics:';
    document.getElementById('music-result').innerHTML = `<div style="font-size:13px;color:var(--dim);background:var(--surface);padding:20px;border-radius:12px;font-family:Georgia,serif;line-height:1.8"><i>"Neon lights on a Sunday night,<br>Blues man playing 'til the morning light,<br>Bach would smile at this crazy sound,<br>Reggae rhythms hitting the ground..."</i><br><br><span style="font-size:10px;font-family:ui-sans-serif">Demo — real lyrics require SUNO_API_KEY</span></div>`;
  }, 1000);
}

function cockpitSpeak() {
  const text = document.getElementById('voice-text').value;
  if (!text) return;
  Cockpit.speak(text);
  document.getElementById('voice-status').textContent = '🔊 Speaking...';
}

Cockpit.init();
</script>
</body>
</html>
