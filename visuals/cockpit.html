<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMARTIE Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#06080d;--surface:#0f1319;--surface-2:#161b22;--ink:#f0f2f5;--ink-2:#c9d1d9;--dim:#8b949e;--line:rgba(255,255,255,.06);--line-2:rgba(255,255,255,.10);--gold:#ffd166;--gold-dim:rgba(255,209,102,.15);--accent:#58a6ff;--accent-dim:rgba(88,166,255,.15);--green:#3fb950;--purple:#bc8cff;--red:#f85149;--serif:'Instrument Serif',Georgia,serif;--sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;position:relative}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(60% 40% at 15% 20%,rgba(255,209,102,.08) 0%,transparent 100%),radial-gradient(50% 35% at 85% 80%,rgba(88,166,255,.06) 0%,transparent 100%);animation:drift 20s ease-in-out infinite alternate;pointer-events:none;z-index:0}
@keyframes drift{0%{opacity:.6;transform:translate(0,0)}100%{opacity:1;transform:translate(8px,-6px)}}
.app{display:flex;flex-direction:column;height:100vh;position:relative;z-index:1}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--line);background:rgba(6,8,13,.85);backdrop-filter:blur(12px);z-index:10}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;letter-spacing:-.01em}
.logo-mark{width:28px;height:28px;border-radius:8px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--bg);font-size:13px}
.header-right{display:flex;align-items:center;gap:12px}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--green);font-weight:500}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.voice-btn{background:var(--surface);border:1px solid var(--line-2);color:var(--ink-2);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s}
.voice-btn:hover{border-color:var(--gold);color:var(--gold)}
.voice-btn.active{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:600}
main{display:flex;flex:1;overflow:hidden}
.sidebar{width:240px;flex-shrink:0;border-right:1px solid var(--line);background:rgba(6,8,13,.5);padding:16px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.section-label{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:12px 12px 6px}
.plugin-btn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;background:transparent;border:1px solid transparent;color:var(--ink-2);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;font-family:var(--sans)}
.plugin-btn:hover{background:var(--surface);border-color:var(--line)}
.plugin-btn.active{background:var(--gold-dim);border-color:rgba(255,209,102,.25);color:var(--gold)}
.plugin-btn.active .plugin-icon{background:rgba(255,209,102,.15);border-color:rgba(255,209,102,.3)}
.plugin-icon{width:34px;height:34px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:all .15s}
.plugin-name{font-weight:600;font-size:13px}
.plugin-desc{font-size:11px;color:var(--dim);font-weight:400}
.content{flex:1;overflow-y:auto;padding:36px;position:relative}
.studio{display:none;animation:fade .3s ease}
.studio.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{max-width:520px;margin:0 auto;text-align:center;padding:60px 20px}
.hero h1{font-family:var(--serif);font-size:48px;font-weight:400;line-height:1.08;letter-spacing:-.03em;margin-bottom:16px}
.hero h1 em{font-style:italic;color:var(--gold)}
.hero p{color:var(--dim);font-size:15px;line-height:1.65;margin-bottom:32px}
.quick-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.quick-btn{display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;background:var(--surface);border:1px solid var(--line-2);color:var(--ink-2);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.quick-btn:hover{border-color:var(--gold);transform:translateY(-1px)}
.quick-btn .qi{font-size:16px}
.studio-head{margin-bottom:28px}
.studio-head h2{font-family:var(--serif);font-size:32px;font-weight:400;display:flex;align-items:center;gap:12px;letter-spacing:-.02em}
.studio-head .desc{color:var(--dim);font-size:14px;margin-top:4px}
.genre-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;margin-bottom:24px}
.genre-btn{padding:12px 6px;border-radius:10px;background:var(--surface);border:1px solid var(--line);text-align:center;cursor:pointer;transition:all .15s;color:var(--ink-2);font-size:11px;font-weight:500}
.genre-btn:hover{border-color:var(--gold);transform:translateY(-1px)}
.genre-btn.active{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:700}
.genre-btn .gi{display:block;font-size:20px;margin-bottom:4px}
.field{margin-bottom:18px;max-width:640px}
.field label{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;color:var(--ink);font-family:var(--sans);font-size:14px;transition:border-color .15s}
.field textarea{min-height:80px;resize:vertical;line-height:1.55}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,209,102,.08)}
.btn-row{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.btn{padding:11px 22px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:8px;border:1px solid transparent;font-family:var(--sans)}
.btn-primary{background:var(--gold);color:var(--bg)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(255,209,102,.25)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn-ghost{background:var(--surface);color:var(--ink-2);border-color:var(--line-2)}
.btn-ghost:hover{border-color:var(--gold)}
.wave{height:56px;background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;gap:3px;padding:0 16px;margin-bottom:24px;overflow:hidden}
.wave span{width:3px;background:var(--gold);border-radius:2px;animation:wave 1.4s ease-in-out infinite alternate}
.wave span:nth-child(1){animation-delay:.0s}
.wave span:nth-child(2){animation-delay:.1s}
.wave span:nth-child(3){animation-delay:.2s}
.wave span:nth-child(4){animation-delay:.3s}
.wave span:nth-child(5){animation-delay:.4s}
.wave span:nth-child(6){animation-delay:.5s}
.wave span:nth-child(7){animation-delay:.6s}
.wave span:nth-child(8){animation-delay:.7s}
.wave span:nth-child(9){animation-delay:.8s}
.wave span:nth-child(10){animation-delay:.9s}
.wave span:nth-child(11){animation-delay:1.0s}
.wave span:nth-child(12){animation-delay:1.1s}
@keyframes wave{0%{height:6px;opacity:.5}100%{height:28px;opacity:1}}
.bubble{background:var(--surface);border:1px solid var(--line-2);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:14px 18px;margin:16px 0 24px;font-size:14px;color:var(--ink-2);max-width:520px;line-height:1.6}
.status{margin-top:16px;font-size:13px;color:var(--dim);min-height:20px}
.result{margin-top:24px;display:flex;flex-wrap:wrap;gap:16px}
.result img,.result video{max-width:340px;border-radius:10px;border:1px solid var(--line)}
@media(max-width:800px){.sidebar{display:none}.hero h1{font-size:34px}.genre-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><div class="logo-mark">A</div><span>AMARTIE</span></div>
    <div class="header-right">
      <div class="status"><div class="status-dot"></div>Live</div>
      <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()">Voice</button>
    </div>
  </header>
  <main>
    <aside class="sidebar">
      <div class="section-label">Studios</div>
      <div id="sidebar"></div>
    </aside>
    <section class="content" id="content">
      <div class="hero">
        <h1>Your AI, <em>Verified.</em></h1>
        <p>The open-source framework that proves your AI wasn't swapped. Nine independent judges. Hash-chained receipts.</p>
        <div class="quick-row">
          <button class="quick-btn" onclick="Cockpit.load('suno-studio')"><span class="qi">🎵</span>Music</button>
          <button class="quick-btn" onclick="Cockpit.load('luma-studio')"><span class="qi">🎬</span>Video</button>
          <button class="quick-btn" onclick="Cockpit.load('leonardo-studio')"><span class="qi">🎨</span>Image</button>
          <button class="quick-btn" onclick="Cockpit.load('elevenlabs-studio')"><span class="qi">🗣️</span>Voice</button>
        </div>
      </div>
    </section>
  </main>
</div>
<script>
const Cockpit={voice:false,synth:window.speechSynthesis,selGenre:null,
plugins:{
  'suno-studio':{name:'Suno Studio',icon:'🎵',desc:'Music generation',render:()=>music()},
  'luma-studio':{name:'Luma Studio',icon:'🎬',desc:'Video generation',render:()=>studio('Luma Dream Machine','video')},
  'leonardo-studio':{name:'Leonardo Studio',icon:'🎨',desc:'Image generation',render:()=>studio('Leonardo.Ai','image')},
  'runway-studio':{name:'Runway Studio',icon:'🎥',desc:'Video synthesis',render:()=>studio('RunwayML','video')},
  'elevenlabs-studio':{name:'ElevenLabs Studio',icon:'🗣️',desc:'Voice synthesis',render:()=>voice()}},
init(){const s=document.getElementById('sidebar');Object.entries(this.plugins).forEach(([id,p])=>{const b=document.createElement('button');b.className='plugin-btn';b.innerHTML=`<div class="plugin-icon">${p.icon}</div><div><div class="plugin-name">${p.name}</div><div class="plugin-desc">${p.desc}</div></div>`;b.onclick=()=>this.load(id);s.appendChild(b)})},
load(id){const p=this.plugins[id];document.querySelectorAll('.plugin-btn').forEach(b=>b.classList.toggle('active',b.querySelector('.plugin-name').textContent===p.name));document.getElementById('content').innerHTML=`<div class="studio active">${p.render()}</div>`;if(this.voice)setTimeout(()=>this.say(`Welcome to ${p.name}. What would you like to create?`),400)},
say(t){if(!this.voice||!this.synth)return;this.synth.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.92;u.volume=.85;this.synth.speak(u)}};
function toggleVoice(){Cockpit.voice=!Cockpit.voice;const b=document.getElementById('voiceBtn');if(Cockpit.voice){b.classList.add('active');b.textContent='Voice On';Cockpit.say('Voice enabled. What would you like to create?')}else{b.classList.remove('active');b.textContent='Voice';Cockpit.synth.cancel()}}
function selGenre(id,btn){document.querySelectorAll('.genre-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');Cockpit.selGenre=id}
const genres=[{id:'country',n:'Country',i:'🤠'},{id:'blues',n:'Blues',i:'🎸'},{id:'jazz',n:'Jazz',i:'🎷'},{id:'reggae',n:'Reggae',i:'🌴'},{id:'electronic',n:'Electronic',i:'🎛️'},{id:'classical',n:'Classical',i:'🎻'},{id:'rock',n:'Rock',i:'🤘'},{id:'hiphop',n:'Hip-Hop',i:'🎤'},{id:'ambient',n:'Ambient',i:'🌊'},{id:'soul',n:'Soul',i:'💋'},{id:'metal',n:'Metal',i:'⚡'},{id:'folk',n:'Folk',i:'🪕'},{id:'bach_blues',n:'Bach+Blues',i:'🎹'},{id:'beethoven_reggae',n:'Beethoven+Reggae',i:'🏛️'},{id:'cyberpunk_jazz',n:'Cyberpunk Jazz',i:'🌃'}];
function music(){return`<div class="studio-head"><h2>🎵 Suno Studio</h2><p class="desc">AI music generation — vocals, instrumentals, full songs</p></div><div class="bubble">👋 Hey! What do you want to create today? Pick a genre below, or tell me something crazy like "reggae with Mozart and bluegrass."</div><div class="wave"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="genre-grid">${genres.map(g=>`<button class="genre-btn" onclick="selGenre('${g.id}',this)"><span class="gi">${g.i}</span>${g.n}</button>`).join('')}</div><div class="field"><label>What's it about?</label><input id="m-theme" placeholder="e.g. driving home for Christmas, a rainy city night..."></div><div class="field"><label>Mood</label><select id="m-mood"><option>heartfelt</option><option>upbeat</option><option>melancholic</option><option>nostalgic</option><option>euphoric</option><option>dark</option><option>smooth</option></select></div><div class="field"><label>Details</label><textarea id="m-details" rows="2" placeholder="Instruments, tempo, era, vibe..."></textarea></div><div class="btn-row"><button class="btn btn-primary" onclick="generate()">Generate Song</button><button class="btn btn-ghost" onclick="genLyrics()">Just Lyrics</button></div><div class="status" id="m-status"></div><div class="result" id="m-result"></div>`}
function studio(name,type){return`<div class="studio-head"><h2>${type==='video'?'🎬':'🎨'} ${name}</h2><p class="desc">AI ${type} generation</p></div><div class="bubble">🎬 Ready to create a ${type}. What's the vision?</div><div class="field"><label>Prompt</label><textarea id="g-prompt" rows="4" placeholder="Describe what you want to create..."></textarea></div><div class="field"><label>Model</label><select id="g-model"><option>ray-3</option><option>ray-2</option><option>gen4.5</option></select></div><div class="btn-row"><button class="btn btn-primary" onclick="generate()">Generate</button></div><div class="status" id="g-status"></div><div class="result" id="g-result"></div>`}
function voice(){return`<div class="studio-head"><h2>🗣️ ElevenLabs Studio</h2><p class="desc">Text-to-speech and voice synthesis</p></div><div class="bubble">🗣️ Ready to speak. Type something below and I'll say it out loud.</div><div class="field"><label>Text</label><textarea id="v-text" rows="4" placeholder="Type anything and hear it spoken..."></textarea></div><div class="field"><label>Voice</label><select id="v-id"><option value="onwK4e9ZLuTAKqWW03F9">Daniel</option><option value="AZnzlk1XvdvUeBnXmlld">Domi</option><option value="EXAVITQu4vr4xnSDxMaL">Bella</option><option value="ErXwobaYiN019PkySvjV">Adam</option></select></div><div class="btn-row"><button class="btn btn-primary" onclick="speak()">Speak</button></div><div class="status" id="v-status"></div>`}
function generate(){const s=document.getElementById('m-status')||document.getElementById('g-status');const r=document.getElementById('m-result')||document.getElementById('g-result');s.textContent='⏳ Generating...';setTimeout(()=>{s.textContent='✅ Demo output:';r.innerHTML='<div style="padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-width:520px"><p style="font-weight:600;margin-bottom:6px">Demo Mode</p><p style="font-size:13px;color:var(--dim);line-height:1.7">Working prototype. For real generation, get a free API key and set the environment variable.</p></div>';if(Cockpit.voice)Cockpit.say('This is a demo.')},1500)}
function genLyrics(){document.getElementById('m-status').textContent='📝 Generating...';setTimeout(()=>{document.getElementById('m-status').textContent='Demo lyrics:';document.getElementById('m-result').innerHTML='<div style="font-size:13px;color:var(--dim);background:var(--surface);padding:20px;border-radius:10px;line-height:1.8;font-family:var(--serif)"><i>"Neon lights on a Sunday night,<br>Blues man playing \'til the morning light,<br>Bach would smile at this crazy sound,<br>Reggae rhythms hitting the ground..."</i><br><br><span style="font-size:10px;font-family:var(--sans)">Demo</span></div>'},1000)}
function speak(){const t=document.getElementById('v-text').value;if(!t)return;Cockpit.say(t);document.getElementById('v-status').textContent='🔊 Speaking...'}
Cockpit.init();
</script>
</body>
</html>
