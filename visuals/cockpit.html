<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AMARTIE — Local Repository Dashboard</title>
  <style>
    :root{--bg:#05070b;--panel:#0d1218;--panel-2:#121a23;--text:#ecf2ff;--muted:#9aa7bb;--line:rgba(255,255,255,.08);--gold:#ffd166;--cyan:#4cc9ff;--green:#3fb950;--red:#f85149}
    *{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:32px 20px 80px}.wrap{max-width:1200px;margin:0 auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--line)}.brand{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:700}.muted{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:20px 0 28px}.card{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:16px;padding:18px 18px 14px;min-height:124px;position:relative;overflow:hidden}.card:before{content:"";position:absolute;inset:0 auto auto 0;width:100%;height:2px;background:linear-gradient(90deg,var(--gold),transparent)}.card h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;font-weight:600}.value{font-size:clamp(28px,3vw,44px);font-weight:700;line-height:1;margin:0}.sub{margin-top:10px;color:var(--muted);font-size:12px}.sections{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin-top:8px}.panel{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:16px;padding:18px 18px 12px}.panel h2{margin:0 0 16px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:11px}td a{color:var(--cyan);text-decoration:none}.badge{display:inline-block;padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--text);background:rgba(255,255,255,.02);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.status{color:var(--green)}.warning{color:var(--gold)}.small{font-size:12px;color:var(--muted)}.spark{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.mini{border:1px solid var(--line);border-radius:12px;padding:12px;background:rgba(255,255,255,.02)}.mini strong{display:block;font-size:22px;margin-top:8px;font-weight:700}@media(max-width:860px){.sections{grid-template-columns:1fr}.topbar{flex-direction:column;align-items:flex-start}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar"><div><div class="brand">AMARTIE</div><div class="small">Local repository monitor</div></div><div class="muted" id="status">Checking local GitHub status…</div></div>
    <div class="cards" id="cards"></div>
    <div class="sections">
      <div class="panel"><h2>Recent repository activity</h2><table><thead><tr><th>Type</th><th>Title</th><th>Updated</th></tr></thead><tbody id="events-body"></tbody></table></div>
      <div class="panel"><h2>Repository traffic summary</h2><div class="spark"><div class="mini"><div class="muted">Views</div><strong id="views-total">0</strong></div><div class="mini"><div class="muted">Clones</div><strong id="clones-total">0</strong></div></div><div style="margin-top:14px"><div class="small" id="traffic-message"></div></div></div>
    </div>
  </div>
  <script>
    // Defense-in-depth: never render restricted domain content in this dashboard.
    const RESTRICTED = /\b(trad(e|ing|es|ed)?|position|entry|entries|stop[- ]?loss|target|profit|losses?|wins?|pips?|market|broker|forex|futures|equities|crypto|bitcoin|ethereum|stock|options?|portfolio|signal|long|short)\b/i;
    const cards=document.getElementById('cards'), eventsBody=document.getElementById('events-body'), statusEl=document.getElementById('status'), viewsTotalEl=document.getElementById('views-total'), clonesTotalEl=document.getElementById('clones-total'), trafficMessageEl=document.getElementById('traffic-message');
    const safeText=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const formatNumber=n=>Number(n||0).toLocaleString();
    function formatDate(value){if(!value)return'—';try{return new Date(value).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}catch{return'—';}}
    function renderCards(metrics){if(!metrics||!metrics.ok){cards.innerHTML='<div class="card"><h3>Repository</h3><p class="value" style="font-size:24px">Unavailable</p><div class="sub">'+safeText(metrics?.message||'GitHub API unavailable.')+'</div></div>';return;}const list=[['Stars',formatNumber(metrics.stargazers_count),'GitHub stars'],['Forks',formatNumber(metrics.forks_count),'Repository forks'],['Issues',formatNumber(metrics.open_issues_count),'Open issues'],['Watchers',formatNumber(metrics.watchers_count),'Subscribers'],['Default branch',metrics.default_branch||'main','Main branch'],['Pushed',formatDate(metrics.pushed_at),'Last repository update']];cards.innerHTML=list.map(x=>`<div class="card"><h3>${safeText(x[0])}</h3><p class="value">${safeText(x[1])}</p><div class="sub">${safeText(x[2])}</div></div>`).join('');}
    function renderEvents(events){const items=(events&&Array.isArray(events.items)?events.items:[]).filter(item=>!RESTRICTED.test(String(item.title||'')));if(!items.length){eventsBody.innerHTML='<tr><td colspan="3" class="small">No permitted repository activity available.</td></tr>';return;}eventsBody.innerHTML=items.slice(0,8).map(item=>`<tr><td><span class="badge">${safeText((item.type||'update').replace('_',' '))}</span></td><td><a href="${safeText(item.html_url||'#')}" target="_blank" rel="noopener noreferrer">${safeText((item.title||'Update').slice(0,80))}</a></td><td class="small">${formatDate(item.updated_at)}</td></tr>`).join('');}
    function renderTraffic(traffic){if(!traffic||!traffic.ok){viewsTotalEl.textContent='0';clonesTotalEl.textContent='0';trafficMessageEl.textContent=traffic?.message||'Traffic endpoints are unavailable.';return;}viewsTotalEl.textContent=formatNumber(traffic.views?.count);clonesTotalEl.textContent=formatNumber(traffic.clones?.count);trafficMessageEl.textContent=traffic.message||'Traffic available from GitHub.';}
    async function loadData(){try{const [a,b,c]=await Promise.all([fetch('/api/github/metrics'),fetch('/api/github/traffic'),fetch('/api/github/events')]);const metrics=a.ok?await a.json():{ok:false,message:'Metrics endpoint unavailable.'};const traffic=b.ok?await b.json():{ok:false,message:'Traffic endpoint unavailable.'};const events=c.ok?await c.json():{items:[]};renderCards(metrics);renderTraffic(traffic);renderEvents(events);statusEl.textContent=metrics?.ok?'Connected to local GitHub API':'GitHub API not ready';statusEl.className='muted '+(metrics?.ok?'status':'warning');}catch{statusEl.textContent='Unable to connect';statusEl.className='muted warning';cards.innerHTML='<div class="card"><h3>Repository</h3><p class="value" style="font-size:24px">Offline</p><div class="sub">The AMARTIE server is not responding.</div></div>';eventsBody.innerHTML='<tr><td colspan="3" class="small">Check that the local server is running.</td></tr>';}}
    loadData();setInterval(loadData,120000);
  </script>
</body>
</html>
